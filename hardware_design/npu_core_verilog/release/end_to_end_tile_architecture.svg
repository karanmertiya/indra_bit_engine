<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
  <defs>
    <style>
      .bg { fill: #f7f9fb; }
      .title { font: 700 30px Arial, sans-serif; fill: #16202a; }
      .subtitle { font: 16px Arial, sans-serif; fill: #4a5a68; }
      .box { fill: #ffffff; stroke: #243447; stroke-width: 2; rx: 10; }
      .engine { fill: #eef6ff; stroke: #0f5a9c; stroke-width: 2; rx: 10; }
      .mem { fill: #fff8e8; stroke: #9a6a00; stroke-width: 2; rx: 10; }
      .ctrl { fill: #eefaf1; stroke: #247a39; stroke-width: 2; rx: 10; }
      .warn { fill: #fff0f0; stroke: #a33; stroke-width: 2; rx: 10; }
      .text { font: 15px Arial, sans-serif; fill: #1d2a35; }
      .small { font: 13px Arial, sans-serif; fill: #3d4b57; }
      .tiny { font: 12px Arial, sans-serif; fill: #526270; }
      .label { font: 700 14px Arial, sans-serif; fill: #1d2a35; }
      .arrow { stroke: #243447; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .thin { stroke: #657786; stroke-width: 1.6; fill: none; marker-end: url(#arrow2); }
      .dash { stroke-dasharray: 7 5; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#243447"/>
    </marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#657786"/>
    </marker>
  </defs>

  <rect class="bg" width="1500" height="980"/>
  <text class="title" x="60" y="55">Verified LLM Inference Tile: Q/K Projection + Q-RoPE</text>
  <text class="subtitle" x="60" y="84">What this release actually proves: deterministic INT8 16x16 tile simulation, golden-model checked for raw Q, K, and Q_RoPE across two FSM runs.</text>

  <rect class="ctrl" x="60" y="130" width="260" height="170"/>
  <text class="label" x="85" y="160">Python Golden Model</text>
  <text class="small" x="85" y="190">golden_model_v2.py</text>
  <text class="small" x="85" y="216">Seeded INT8 X, Wq, Wk</text>
  <text class="small" x="85" y="242">Computes NumPy Q/K</text>
  <text class="small" x="85" y="268">Computes fixed LUT RoPE</text>

  <rect class="mem" x="390" y="120" width="230" height="90"/>
  <text class="label" x="420" y="155">Input SRAM Hex</text>
  <text class="small" x="420" y="181">sram_act.hex</text>
  <text class="small" x="420" y="201">sram_wgt.hex</text>

  <rect class="mem" x="390" y="240" width="230" height="110"/>
  <text class="label" x="420" y="276">Golden References</text>
  <text class="small" x="420" y="302">sram_golden_q.hex</text>
  <text class="small" x="420" y="322">sram_golden_k.hex</text>
  <text class="small" x="420" y="342">sram_golden_q_rope.hex</text>

  <rect class="ctrl" x="705" y="130" width="245" height="170"/>
  <text class="label" x="730" y="160">npu_tile_top FSM</text>
  <text class="small" x="730" y="190">start/done control</text>
  <text class="small" x="730" y="216">Q fill, flush, drain</text>
  <text class="small" x="730" y="242">K fill, flush, drain</text>
  <text class="small" x="730" y="268">RoPE read/write</text>

  <rect class="engine" x="1060" y="95" width="310" height="150"/>
  <text class="label" x="1095" y="130">16x16 INT8 Systolic Array</text>
  <text class="small" x="1095" y="160">256 MAC cells</text>
  <text class="small" x="1095" y="186">INT8 x INT8 accumulation</text>
  <text class="small" x="1095" y="212">Outputs 16 x INT32 lanes per drain row</text>

  <rect class="mem" x="1060" y="315" width="310" height="145"/>
  <text class="label" x="1095" y="350">Buffer SRAM</text>
  <text class="small" x="1095" y="380">Rows 0..15: raw Q</text>
  <text class="small" x="1095" y="406">Rows 16..31: raw K</text>
  <text class="small" x="1095" y="432">Rows 32..47: Q_RoPE</text>

  <rect class="engine" x="705" y="385" width="245" height="135"/>
  <text class="label" x="730" y="420">8-Lane RoPE Unit</text>
  <text class="small" x="730" y="450">rope_vector_unit.v</text>
  <text class="small" x="730" y="476">8 x rope_act_v3</text>
  <text class="small" x="730" y="500">16 dimensions per row</text>

  <rect class="box" x="390" y="460" width="230" height="130"/>
  <text class="label" x="420" y="496">Testbench Checks</text>
  <text class="small" x="420" y="526">Test 1: normal start</text>
  <text class="small" x="420" y="552">Test 2: held start</text>
  <text class="small" x="420" y="578">Compares Q, K, Q_RoPE</text>

  <rect class="box" x="60" y="445" width="260" height="165"/>
  <text class="label" x="85" y="482">Measured Simulation Result</text>
  <text class="small" x="85" y="512">Latency: 149 cycles/run</text>
  <text class="small" x="85" y="538">At 100 MHz TB clock: 1.49 us</text>
  <text class="small" x="85" y="564">Two-run test passes bit-accurate</text>
  <text class="small" x="85" y="590">VCD emitted: integrated_tile.vcd</text>

  <rect class="warn" x="705" y="610" width="665" height="190"/>
  <text class="label" x="735" y="646">Brutal Scope Boundary</text>
  <text class="small" x="735" y="678">This is not the full DeepSeek-V3 model end-to-end.</text>
  <text class="small" x="735" y="704">It is a verified tile for Q/K projection and Q-RoPE using simplified fixed LUT RoPE.</text>
  <text class="small" x="735" y="730">No attention softmax, V path, MLA cache system, MoE experts, SwiGLU MLP, tokenizer, scheduler, HBM, or real PDK physical implementation is verified here.</text>
  <text class="small" x="735" y="756">No measured physical area, power, unit cost, or real GPU speedup exists without PDK timing/power/area and a fair software/hardware baseline.</text>

  <rect class="box" x="60" y="680" width="560" height="170"/>
  <text class="label" x="85" y="716">Defensible Portfolio Claim</text>
  <text class="small" x="85" y="746">One-click Icarus flow verifies a 16x16 INT8 systolic tile integrated with SRAM and RoPE.</text>
  <text class="small" x="85" y="772">Golden references are regenerated from Python and checked against RTL outputs.</text>
  <text class="small" x="85" y="798">Yosys generic synthesis/check reports 0 structural problems for npu_tile_top.</text>
  <text class="small" x="85" y="824">Do not claim full DeepSeek-V3 ASIC, physical silicon, power, cost, or 90x speedup yet.</text>

  <path class="arrow" d="M 320 185 L 390 165"/>
  <path class="thin" d="M 320 245 L 390 295"/>
  <path class="arrow" d="M 620 165 L 705 190"/>
  <path class="thin" d="M 620 295 L 705 260"/>
  <path class="arrow" d="M 950 190 L 1060 170"/>
  <path class="arrow" d="M 1215 245 L 1215 315"/>
  <path class="arrow" d="M 1060 390 L 950 450"/>
  <path class="arrow" d="M 705 450 L 620 520"/>
  <path class="arrow" d="M 950 475 L 1060 430"/>
  <path class="thin dash" d="M 390 535 L 320 535"/>

  <text class="tiny" x="60" y="930">Generated for the release package. This diagram is architectural and verification-oriented; it is not a placed-and-routed physical layout.</text>
</svg>
